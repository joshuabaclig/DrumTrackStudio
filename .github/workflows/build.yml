name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error `
            -ExcludeRule PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions, PSUseApprovedVerbs
          $results | Format-Table -AutoSize | Out-String | Write-Host
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check release notes exist
        shell: pwsh
        run: |
          $notes = 'release-notes/${{ github.ref_name }}.md'
          if (-not (Test-Path $notes)) { throw "Missing $notes - write the release notes before tagging." }

      - name: Fetch vendored binaries
        shell: pwsh
        run: |
          # bin/*.exe are not committed; fetch from official sources, then VERIFY
          # against the pinned hashes in tools.lock.json (Build-Runtime.ps1 does the
          # verification and fails the build on any mismatch).
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          # Versioned urls, matching tools.lock.json - upgrade all three places together.
          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.21/yt-dlp.exe' -OutFile bin/yt-dlp.exe
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip' -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath fftmp -Force
          $ff = Get-ChildItem fftmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ff.FullName bin/ffmpeg.exe
          Copy-Item (Join-Path $ff.DirectoryName 'ffprobe.exe') bin/ffprobe.exe
          Remove-Item ff.zip, fftmp -Recurse -Force
          Invoke-WebRequest -Uri 'https://github.com/denoland/deno/releases/download/v2.9.8/deno-x86_64-pc-windows-msvc.zip' -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath denotmp -Force
          $deno = Get-ChildItem denotmp -Recurse -Filter deno.exe | Select-Object -First 1
          Copy-Item $deno.FullName bin/deno.exe
          Remove-Item deno.zip, denotmp -Recurse -Force
          # The next step verifies these against tools.lock.json and fails the build
          # on any mismatch.

      - name: Verify binaries + build runtime
        shell: pwsh
        run: ./Build-Runtime.ps1

      - name: Build exe (signs only if cert secret configured)
        shell: pwsh
        env:
          DTS_CERT_THUMBPRINT: ${{ secrets.DTS_CERT_THUMBPRINT }}
        run: ./Build-Exe.ps1 -Version ('${{ github.ref_name }}' -replace '^v','')

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        env:
          DTS_CERT_THUMBPRINT: ${{ secrets.DTS_CERT_THUMBPRINT }}
        run: ./Build-Installer.ps1 -Version ('${{ github.ref_name }}' -replace '^v','')

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          # every v* tag needs a matching release-notes/<tag>.md (checked at the start of this job)
          body_path: release-notes/${{ github.ref_name }}.md
          files: |
            dist/DrumTrackStudio-Setup-*.exe
            dist/checksums.txt
