name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error `
            -ExcludeRule PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions, PSUseApprovedVerbs
          $results | Format-Table -AutoSize | Out-String | Write-Host
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch vendored binaries
        shell: pwsh
        run: |
          # bin/*.exe are not committed; fetch from official sources, then VERIFY
          # against the pinned hashes in tools.lock.json (Build-Runtime.ps1 does the
          # verification and fails the build on any mismatch).
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile bin/yt-dlp.exe
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath fftmp -Force
          $ff = Get-ChildItem fftmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ff.FullName bin/ffmpeg.exe
          Copy-Item (Join-Path $ff.DirectoryName 'ffprobe.exe') bin/ffprobe.exe
          Remove-Item ff.zip, fftmp -Recurse -Force
          # NOTE: 'latest' may legitimately differ from the pinned hashes as upstream
          # releases move. When that happens the next step fails on purpose - update
          # tools.lock.json in a tested commit to pick up new tool versions.

      - name: Verify binaries + build runtime
        shell: pwsh
        run: ./Build-Runtime.ps1

      - name: Build exe (signs only if cert secret configured)
        shell: pwsh
        env:
          DTS_CERT_THUMBPRINT: ${{ secrets.DTS_CERT_THUMBPRINT }}
        run: ./Build-Exe.ps1 -Version ('${{ github.ref_name }}' -replace '^v','')

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        env:
          DTS_CERT_THUMBPRINT: ${{ secrets.DTS_CERT_THUMBPRINT }}
        run: ./Build-Installer.ps1 -Version ('${{ github.ref_name }}' -replace '^v','')

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DrumTrackStudio-Setup-*.exe
            dist/checksums.txt
